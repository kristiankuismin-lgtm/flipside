<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flipside</title>
<style>
:root{
  --bg:#faf9f7; --panel:#fff; --panel2:#f5f3f0; --hover:#f1eee9;
  --line:#ebe7e1; --line2:#ddd7cf;
  --ink:#1c1a17; --dim:#625c55; --faint:#948d84;
  --accent:#c2614f; --accent-ink:#9e4634; --accent-bg:#fcefeb;
  --green:#2d7a4f; --green-bg:#e9f4ed; --green-line:#bfe0cc;
  --amber:#90610a; --amber-bg:#fcf3de; --amber-line:#ecd9a6;
  --red:#b03628;  --red-bg:#fdece9; --red-line:#f3c7bf;
  --blue:#365e9e; --blue-bg:#eaf0fb; --purple:#67499c; --purple-bg:#f1ecfb;
  --sh:0 1px 2px rgba(28,26,23,.05);
  --sh2:0 8px 28px rgba(28,26,23,.12);
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sans:Inter,"Inter var",-apple-system,BlinkMacSystemFont,"Segoe UI",
    system-ui,"Helvetica Neue",sans-serif;
  /* An 8px grid. Named so a spacing decision is a choice between steps
     rather than a number someone typed. */
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:48px;
  --measure:1200px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  /* Proportional text, tabular figures. Mono is for numbers only. */
  font-variant-numeric:tabular-nums;letter-spacing:-0.003em}
h1,h2,h3{letter-spacing:-0.012em}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

.app{display:grid;grid-template-columns:216px 1fr;height:100vh}

/* ---------------- sidebar ---------------- */
.nav{background:var(--panel);border-right:1px solid var(--line);display:flex;
  flex-direction:column;overflow-y:auto}
.brand{padding:15px 16px 13px;display:flex;align-items:center;gap:9px}
.brand .sq{width:23px;height:23px;border-radius:6px;background:var(--accent);
  display:grid;place-items:center;font:700 12px var(--sans);color:#fff}
.brand b{font-size:15px;font-weight:650;letter-spacing:-.015em}
.navsearch{position:relative;padding:4px 10px 8px}
.navsearch .qsin{width:100%}
.navsearch .qspop{left:10px;right:auto;width:360px;top:calc(100% - 2px)}
.navsec{padding:14px 12px 5px;font:10px var(--mono);letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint)}
.navitem{display:flex;align-items:center;gap:9px;padding:7px 11px;margin:1px 8px;
  border-radius:7px;color:var(--dim);font-size:13.5px;background:none;border:0;
  width:calc(100% - 16px);text-align:left}
.navitem:hover{background:var(--hover);color:var(--ink)}
.navitem.on{background:var(--accent-bg);color:var(--accent-ink);font-weight:600}
.navitem .ic{width:16px;height:16px;flex-shrink:0;opacity:.75;display:grid;place-items:center}
.navitem .ic svg{width:16px;height:16px}
.navitem.on .ic{opacity:1}
.navitem .ct{margin-left:auto;font:10px var(--mono);color:var(--faint)}
.navitem.on .ct{color:var(--accent)}
.navspacer{margin-top:auto}
.navfoot-unused{padding:13px 16px;border-top:1px solid var(--line);
  font:11px var(--sans);color:var(--faint);line-height:1.65}

/* ---------------- top bar ---------------- */
.main{overflow-y:auto}
.bar{position:sticky;top:0;z-index:30;background:rgba(250,249,247,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:9px 22px;display:flex;align-items:center;gap:12px}
.crumb{font-size:13px;color:var(--faint)}
.crumb b{color:var(--ink);font-weight:600}
.crumb button{background:none;border:0;color:var(--faint);padding:0}
.crumb button:hover{color:var(--ink);text-decoration:underline}
.grow{flex:1}
.btn{background:var(--panel);border:1px solid var(--line2);border-radius:7px;
  padding:6px 12px;font-size:13px;color:var(--dim);box-shadow:var(--sh)}
.btn:hover{background:var(--hover);color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--accent-ink)}
.wrap{padding:var(--s3) var(--s4) 88px;max-width:var(--measure);margin:0 auto}

/* ---------------- quick search ---------------- */
.qs{position:relative}
.qsin{display:flex;align-items:center;gap:7px;background:var(--panel);
  border:1px solid var(--line2);border-radius:8px;padding:5px 10px;width:270px;
  box-shadow:var(--sh)}
.qsin:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.qsin input{border:0;outline:0;background:none;font:13.5px var(--sans);width:100%;
  color:var(--ink);padding:1px 0}
.qsin .mag{color:var(--faint);font-size:12px}
.qsin kbd{font:10px var(--mono);color:var(--faint);border:1px solid var(--line);
  border-radius:4px;padding:1px 4px;background:var(--panel2)}
.qspop{position:absolute;top:calc(100% + 7px);right:0;width:420px;background:var(--panel);
  border:1px solid var(--line2);border-radius:11px;box-shadow:var(--sh2);
  overflow:hidden;display:none;z-index:40}
.qspop.on{display:block}
.qstabs{display:flex;gap:6px;padding:9px 11px;border-bottom:1px solid var(--line)}
.qstab{border:1px solid var(--line2);background:var(--panel);border-radius:999px;
  padding:4px 13px;font-size:12.5px;color:var(--dim)}
.qstab.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:550}
.qsres{max-height:330px;overflow-y:auto;padding:5px}
.qsrow{display:flex;gap:10px;padding:8px 9px;border-radius:7px;cursor:pointer;align-items:flex-start}
.qsrow:hover{background:var(--hover)}
.qsrow .nm{font-weight:550;font-size:13.5px}
.qsrow .ds{font-size:12px;color:var(--faint);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qsempty{padding:22px;text-align:center;color:var(--faint);font-size:12.5px}

/* ---------------- home ---------------- */
.home{max-width:740px;margin:0 auto;padding:13vh 20px 60px}
.homehd{text-align:center;margin-bottom:26px}
.homehd .sq{width:34px;height:34px;border-radius:9px;background:var(--accent);
  display:grid;place-items:center;font:700 16px var(--sans);color:#fff}
.homehd h1{margin:0 0 10px;font-size:32px;font-weight:620;letter-spacing:-.035em}
.homesub{margin:0 auto;max-width:54ch;font-size:14.5px;line-height:1.65;color:var(--dim)}
.ask{background:var(--panel);border:1px solid var(--line2);border-radius:14px;
  box-shadow:var(--sh2);padding:4px 4px 4px 0;transition:border-color .15s}
.ask:focus-within{border-color:var(--accent)}
.ask textarea{width:100%;border:0;outline:0;resize:none;background:none;
  font:15px/1.5 var(--sans);color:var(--ink);padding:14px 16px 6px;min-height:58px}
.ask textarea::placeholder{color:var(--faint)}
.askfoot{display:flex;align-items:center;gap:8px;padding:4px 10px 8px 16px}
.askfoot .hint{font-size:11.5px;color:var(--faint)}
.send{margin-left:auto;width:30px;height:30px;border-radius:8px;border:0;
  background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px}
.send:hover{background:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.chip{border:1px solid var(--line2);background:var(--panel);border-radius:999px;
  padding:6px 14px;font-size:13px;color:var(--dim);box-shadow:var(--sh)}
.chip:hover{background:var(--hover);color:var(--ink);border-color:var(--line2)}
.chip .ic{opacity:.7;margin-right:5px}
.homenote{text-align:center;margin-top:30px;font-size:12.5px;color:var(--faint);line-height:1.75}

/* ---------------- search panel ---------------- */
.search{background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:15px 17px;margin-bottom:17px;display:flex;gap:12px;align-items:flex-end;
  flex-wrap:wrap;box-shadow:var(--sh)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
input,select,textarea{background:var(--panel);border:1px solid var(--line2);color:var(--ink);
  padding:8px 11px;border-radius:8px;font:13.5px var(--sans);min-width:150px}
.search input{min-width:270px}
input:focus,select:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-bg)}
.qsin input,.ask textarea{border:0;box-shadow:none;padding:0;min-width:0;border-radius:0}
.qsin input:focus,.ask textarea:focus{box-shadow:none}
.ask textarea{padding:14px 16px 6px}

/* ---------------- stat cards ---------------- */
.stats{display:grid;gap:12px;margin-bottom:26px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:17px 19px;box-shadow:var(--sh)}
.stat .k{font-size:11.5px;color:var(--faint);margin-bottom:9px;line-height:1.35}
.stat .v{font:640 29px/1 var(--sans);letter-spacing:-.035em}
.stat .v.mono{font-family:var(--mono);font-size:25px;letter-spacing:-.03em}

/* ---------------- sections ---------------- */
.sec{margin:34px 0 0}
.sech{display:flex;align-items:center;gap:8px;margin-bottom:14px;cursor:pointer;user-select:none}
.sech .cv{color:var(--faint);font-size:10px;transition:transform .15s}
.sech.closed .cv{transform:rotate(-90deg)}
.sech h3{margin:0;font-size:16px;font-weight:620;letter-spacing:-.02em}
.sech .hint{margin-left:auto;font-size:12px;color:var(--faint)}
.secb.closed{display:none}

/* ---------------- table ---------------- */
/* A wide table scrolls inside its own frame. overflow:hidden clipped the
   right-hand columns off a narrow window instead, so Conflict and Route
   simply vanished rather than being reachable. */
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  overflow-x:auto;overflow-y:hidden;box-shadow:var(--sh);
  -webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:620px}
th{text-align:left;font:10px var(--mono);letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);font-weight:500;padding:11px 16px;background:var(--panel2);
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:var(--s2);border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
.rank{font:11px var(--mono);color:var(--faint);width:32px}
.ent{display:flex;align-items:center;gap:10px}
.logo{width:26px;height:26px;border-radius:7px;background:var(--panel);
  border:1px solid var(--line);flex-shrink:0;object-fit:contain;padding:2px}
.ent .nm{font-weight:570}
.ent .sb{font:10.5px var(--mono);color:var(--faint)}
/* One rule decides alignment for a column, so the header can never drift
   away from the cells under it. Tabular figures stop the digits dancing. */
.num{font:13px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}
table{table-layout:auto}
.w-rank{width:34px}
.w-date{width:110px}
.w-flags{width:1%;white-space:nowrap}
.w-act{width:1%}
.flags{text-align:right;white-space:nowrap}
.flags .bdg{margin-left:4px}
.tdact{text-align:right;white-space:nowrap;width:1%}

/* ---------------- badges ---------------- */
.bdg{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11.5px;
  line-height:1.35;white-space:nowrap;font-weight:500}
.b-green{background:var(--green-bg);color:var(--green)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.b-purple{background:var(--purple-bg);color:var(--purple)}
.b-grey{background:var(--panel2);color:var(--faint)}
.b-accent{background:var(--accent-bg);color:var(--accent-ink)}
.bdgs{display:flex;gap:5px;flex-wrap:wrap}

/* ---------------- entity ---------------- */
.ehd{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:18px 20px 0;box-shadow:var(--sh)}
.ehdtop{display:flex;align-items:flex-start;gap:14px;padding-bottom:3px}
.elogo{width:52px;height:52px;border-radius:12px;background:var(--panel);
  border:1px solid var(--line);flex-shrink:0;object-fit:contain;padding:5px}
.ehd h1{margin:0 0 5px;font-size:25px;font-weight:650;letter-spacing:-.03em}
.emeta{font-size:13px;color:var(--dim);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eacts{margin-left:auto;display:flex;gap:7px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px -20px 0;
  padding:0 20px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 13px;font-size:13.5px;color:var(--dim);
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent-ink);font-weight:600;border-bottom-color:var(--accent)}
.tabbody{padding-top:18px}
.lede{color:var(--dim);font-size:13.5px;line-height:1.7;margin:0 0 16px;max-width:1000px}

/* ---------------- cards / charts ---------------- */
.hl{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.hl.tight{grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:8px}
.hl.tight .hlc{padding:10px 12px}
.hl.tight .hlhd{margin-bottom:6px;gap:8px}
.hl.tight .nm{font-size:13px}
.facts{display:flex;gap:10px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.facts b{color:var(--ink);font-weight:620}
.with{font-size:11.5px;color:var(--faint);margin-top:3px;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.srcline{display:block;font:10.5px var(--mono);color:var(--faint);margin-top:6px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcline:hover{color:var(--blue)}
.hlc{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:13px 15px;box-shadow:var(--sh)}
.hlc.red{background:var(--red-bg);border-color:var(--red-line)}
.hlc.green{background:var(--green-bg);border-color:var(--green-line)}
.hlhd{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.hlhd .nm{font-weight:620;font-size:13.5px;line-height:1.25}
.hlhd .sb{font:10.5px var(--mono);color:var(--faint)}
.hlhd .bdg{margin-left:auto}
.hlm{display:flex;gap:20px}
.hlm .k{font-size:10.5px;color:var(--faint)}
.hlm .v{font:620 13.5px var(--sans);margin-top:1px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:19px 21px;box-shadow:var(--sh)}
.card h4{margin:0 0 3px;font-size:13.5px;font-weight:620}
.card .sub{font-size:12px;color:var(--faint);margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:11px}
.bgrp{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:10px}
.bgrp .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;box-shadow:var(--sh)}
.bgrp .box .k{font-size:11.5px;color:var(--faint);margin-bottom:8px}
.barrow{display:grid;grid-template-columns:120px 1fr 46px;align-items:center;
  gap:10px;margin:7px 0;font-size:12.5px}
.barrow .lbl{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bart{height:15px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bart i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bart i.g{background:var(--green)} .bart i.a{background:var(--amber)}
.bart i.r{background:var(--red)}   .bart i.n{background:var(--line2)}
.barrow .pc{font:11.5px var(--mono);color:var(--dim);text-align:right}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.legend div{display:flex;align-items:center;gap:7px;color:var(--dim)}
.legend i{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.donutwrap{display:flex;align-items:center;gap:17px}
.ev{border-left:2px solid var(--line2);padding-left:12px;margin-top:9px}
.ev div{font-size:12.5px;color:var(--dim);margin:5px 0;line-height:1.5}
.srank{display:inline-block;font:9px var(--mono);letter-spacing:.07em;padding:2px 5px;
  border-radius:4px;background:var(--panel2);color:var(--faint);margin-right:6px}
.reasons li{font-size:13px;color:var(--dim);margin:6px 0}
.verdict{padding:var(--s2);border-radius:10px;margin-bottom:var(--s2);font-size:13.5px;line-height:1.6}
.verdict.red{background:var(--red-bg);border:1px solid var(--red-line);color:#8c2b20}
.verdict.green{background:var(--green-bg);border:1px solid var(--green-line);color:#1f5e3a}
.verdict.grey{background:var(--panel);border:1px solid var(--line);color:var(--dim);box-shadow:var(--sh)}

/* ---------------- map ---------------- */
.maproot{display:grid;grid-template-columns:1fr 330px;gap:11px;align-items:start}
.mapbox{position:relative;border:1px solid var(--line);border-radius:11px;overflow:hidden;
  box-shadow:var(--sh);background:var(--panel)}
#mlmap{height:540px;width:100%}
.mapbar{display:flex;gap:10px;align-items:center;padding:10px 12px;
  border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel)}
.mapbar .grp{display:flex;gap:5px;align-items:center}
.mapbar .lbl{font:10px var(--mono);letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);margin-right:2px}
.tgl{border:1px solid var(--line2);background:var(--panel);border-radius:7px;
  padding:5px 10px;font-size:12.5px;white-space:nowrap;color:var(--dim);display:inline-flex;
  align-items:center;gap:6px}
.tgl:hover{background:var(--hover);color:var(--ink)}
.tgl.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:550}
.tgl i{width:9px;height:9px;display:inline-block;background:currentColor;opacity:.85}
.tgl i.sq{border-radius:2px} .tgl i.ci{border-radius:50%} .tgl i.di{transform:rotate(45deg)}
.mapctl{position:absolute;top:11px;left:11px;z-index:3;display:flex;gap:6px;flex-wrap:wrap}
.mapctl .btn{background:rgba(255,255,255,.94);backdrop-filter:blur(6px)}
.mapsearch{display:flex;align-items:center;gap:6px;background:var(--bg);
  border:1px solid var(--line2);border-radius:8px;padding:5px 10px;
  flex:1 1 180px;min-width:150px;max-width:320px}
.mapsearch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.mapsearch input{border:0;outline:0;background:none;font:13px var(--sans);width:100%;padding:0;
  min-width:0;box-shadow:none}
.mlpop{font:13px var(--sans)}
.maplegend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:9px 13px;
  border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);background:var(--panel)}
.maplegend .sw{display:inline-flex;align-items:center;gap:6px}
.maplegend .sw i{width:9px;height:9px;border-radius:50%}
.maplegend .sw.off{opacity:.35}
.maplegend .sw{cursor:pointer;user-select:none}
.mkr.sq{border-radius:4px}
.mkr.di{border-radius:3px;transform:rotate(45deg)}
.mkr{border-radius:50%;border:1.5px solid rgba(255,255,255,.95);
  box-shadow:0 1px 3px rgba(0,0,0,.22);cursor:pointer;opacity:.82;
  transition:opacity .12s,transform .12s}
.mkr:hover{opacity:1;transform:scale(1.35);z-index:5}
.side{background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--sh);
  overflow:hidden;position:sticky;top:64px;max-height:calc(100vh - 90px);display:flex;flex-direction:column}
.sidehd{padding:13px 15px;border-bottom:1px solid var(--line)}
.sidehd h3{margin:0;font-size:14.5px;font-weight:620}
.sidehd .s{font-size:11.5px;color:var(--faint);margin-top:2px}
.sidebody{overflow-y:auto;padding:13px 15px}
.sideitem{padding:9px 0;border-bottom:1px solid var(--line)}
.sideitem:last-child{border-bottom:0}
.sideitem .n{font-weight:570;font-size:13.5px}
.sideitem .d{font-size:12px;color:var(--faint);line-height:1.45;margin-top:2px}
@media(max-width:1100px){.maproot{grid-template-columns:1fr}.side{position:static;max-height:none}}

.geo{background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:5px;position:relative;box-shadow:var(--sh)}
.geo svg{display:block;width:100%;height:auto;border-radius:8px}
.land{fill:#ece7df;stroke:#dcd5ca;stroke-width:.6;stroke-linejoin:round}
.sea{fill:#f7f5f1}
.grat{stroke:#e2ddd4;stroke-width:.5;fill:none}
.bub{stroke:#fff;stroke-width:1.3;cursor:pointer;transition:opacity .12s}
.bub:hover{stroke:var(--ink);stroke-width:1.8}
.citylbl{font:9.5px var(--mono);fill:var(--faint);pointer-events:none}
.tip{position:absolute;pointer-events:none;background:var(--panel);
  border:1px solid var(--line2);border-radius:9px;padding:9px 12px;font-size:12.5px;
  opacity:0;transition:opacity .12s;z-index:5;max-width:260px;box-shadow:var(--sh2)}
.tip.on{opacity:1}
.tip b{display:block;margin-bottom:3px}
.tip .m{color:var(--faint);font-size:11.5px;line-height:1.5}
.maplg{display:flex;gap:17px;align-items:center;padding:10px 14px;font-size:12px;
  color:var(--faint);border-top:1px solid var(--line);flex-wrap:wrap}
.maplg .sw{display:inline-flex;align-items:center;gap:6px}
.maplg .sw i{width:9px;height:9px;border-radius:50%;display:inline-block}

.big{font:640 46px/1 var(--sans);letter-spacing:-.04em}
.cmp{display:grid;grid-template-columns:160px 1fr 66px;gap:11px;align-items:center;margin:9px 0}
.cmp .l{font-size:13px;color:var(--dim)}
.cmp .t{height:20px;background:var(--panel2);border-radius:5px;overflow:hidden}
.cmp .t i{display:block;height:100%;border-radius:5px;background:var(--line2)}
.cmp .t i.hi{background:var(--green)} .cmp .t i.lo{background:var(--red)}
.cmp .t i.base{background:var(--accent)}
.cmp .v{font:13px var(--mono);text-align:right}

.scrim{position:fixed;inset:0;background:rgba(28,26,23,.35);z-index:60;
  display:grid;place-items:center;padding:20px}
.composebox{background:var(--panel);border:1px solid var(--line2);border-radius:14px;
  box-shadow:var(--sh2);width:min(620px,96vw);max-height:92vh;overflow-y:auto}
.msg{padding:var(--s5) var(--s3);text-align:center;color:var(--faint);font-size:13.5px}

/* --- keyboard --- */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
tbody tr.kbd{background:var(--accent-bg)!important;
  box-shadow:inset 3px 0 0 var(--accent)}
.kbdhint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  display:flex;gap:14px;align-items:center;padding:7px 14px;border-radius:999px;
  background:var(--ink);color:#fff;font-size:11.5px;box-shadow:var(--sh2);
  opacity:0;pointer-events:none;transition:opacity .18s;z-index:60}
.kbdhint.on{opacity:.93}
.kbdhint kbd{font:10.5px var(--mono);background:rgba(255,255,255,.17);
  border-radius:4px;padding:2px 5px;margin-right:4px}

/* --- figures you can open --- */
.figure{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;
  border-bottom:1px dotted var(--line2);line-height:1.3}
.figure:hover{border-bottom-color:var(--accent);color:var(--accent-ink)}
.figure .bdg{cursor:pointer}
.evclaim{padding:11px 13px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel2);font-size:14px;line-height:1.5}
.evclaim .sub{display:block;margin-top:4px;font:11px var(--mono);color:var(--faint)}
.mathtbl{width:100%;border-collapse:collapse}
.mathtbl td{padding:7px 10px;border-bottom:1px solid var(--line);font-size:12.5px;
  vertical-align:top}
.mathtbl td:first-child{font-weight:550;width:120px}
.mathtbl td.num{width:60px;font:12.5px var(--mono);font-variant-numeric:tabular-nums}
.mathtbl tr:last-child td{border-bottom:0}

/* --- what Ask did with your question --- */
.asktrace{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px;
  padding:9px 13px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel);font-size:12px;color:var(--dim)}
.asktrace .q{font-weight:560;color:var(--ink)}
.asktrace .arrow{color:var(--faint)}
.asktrace .why{color:var(--accent-ink)}
.asktrace .alt{margin-left:auto;color:var(--faint);font-size:11.5px}
.lnk{background:none;border:0;padding:0;font:inherit;color:var(--blue);
  cursor:pointer;text-decoration:underline}
.lnk.x{color:var(--faint);text-decoration:none;font-size:15px;line-height:1}

/* Map chrome: the attribution stays (ODbL), but muted into the frame. */
.maplibregl-ctrl-attrib{background:transparent!important;font-size:9.5px!important;
  padding:0 6px!important;margin:0 4px 3px 0!important}
.maplibregl-ctrl-attrib a{color:var(--faint)!important;text-decoration:none}
.maplibregl-ctrl-attrib-button{display:none!important}
.maplibregl-ctrl-bottom-left{opacity:.55}
.maplibregl-ctrl-bottom-left:hover{opacity:1}

/* --- conflict flow --- */
.cmap{overflow-x:auto}
.cmap svg{display:block;width:100%;min-width:720px;height:auto}
.chd{font:10px var(--mono);letter-spacing:.11em;fill:var(--faint)}
.cedge{fill:none;stroke:var(--line2);stroke-width:1.5}
.cedge.hot{stroke:var(--red);stroke-width:1.75;opacity:.42}
.cmap svg:hover .cedge.hot{opacity:.2}
.cmap svg .cedge.hot:hover{opacity:1;stroke-width:2.5}
.cnode rect{fill:var(--panel);stroke:var(--line2);stroke-width:1}
.cnode.me rect{fill:var(--ink);stroke:var(--ink)}
.cnode.comp rect{fill:var(--panel2);stroke:var(--line2)}
.cnode.hot rect{fill:var(--red-bg);stroke:var(--red-line)}
.cnl{font:12.5px var(--sans);font-weight:560;fill:var(--ink)}
.cnode.me .cnl{fill:#fff}
.cnode.hot .cnl{fill:#8c2b20}
.cns{font:9px var(--mono);letter-spacing:.05em;fill:var(--faint)}
.cnode.hot .cns{fill:var(--red)}
.cmapnote{margin-top:10px;font-size:11.5px;color:var(--faint);line-height:1.55}

/* --- comparative bars --- */
.barrow .bart{position:relative}
.barrow.unk .bart{background:repeating-linear-gradient(135deg,var(--panel2),
  var(--panel2) 5px,var(--line) 5px,var(--line) 6px)}
.barrow .nodata{position:absolute;left:8px;top:50%;transform:translateY(-50%);
  font:10px var(--mono);color:var(--faint);letter-spacing:.04em}
.barrow .tick{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;
  background:var(--ink);opacity:.5}
.barrow .tick::after{content:"";position:absolute;left:-2px;top:-3px;
  border-left:3px solid transparent;border-right:3px solid transparent;
  border-top:4px solid var(--ink);opacity:.75}
.barnote{margin-top:10px;font-size:11.5px;color:var(--faint);line-height:1.55;max-width:58ch}
.pubrow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;
  border-bottom:1px solid var(--line);font-size:13px;line-height:1.6}
.pubrow:last-child{border-bottom:0}
.pubrow .pk{flex:none;width:76px;font:10px var(--mono);letter-spacing:.06em;
  text-transform:uppercase;color:var(--faint);padding-top:3px}
.pubrow .sub{font-size:11.5px;color:var(--faint)}
.sitetitle{font-size:14px;font-weight:600;color:var(--ink);line-height:1.4}
.sitesigs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sitesig{display:flex;flex-direction:column;gap:2px;padding:8px 11px;
  border:1px solid var(--line);border-radius:8px;background:var(--panel2);
  text-decoration:none;min-width:150px}
.sitesig:hover{background:var(--hover);border-color:var(--line2)}
.sitesig b{font-size:12.5px;color:var(--ink);font-weight:570}
.sitesig span{font:10.5px var(--mono);color:var(--faint)}
.dring{position:relative;display:inline-flex}
.dval{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;pointer-events:none}
.dval b{font:16px/1 var(--mono);font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums}
.legend{max-width:160px}
.paceline{display:flex;align-items:baseline;gap:10px;margin-top:14px;
  padding-top:13px;border-top:1px solid var(--line)}
.paceline .lbl{width:150px;flex:none;font-size:12.5px;color:var(--dim)}
.pacev{font:12.5px var(--mono);font-weight:600}
.pacev.g{color:var(--green)} .pacev.a{color:var(--amber)}
.pacev.r{color:var(--red)} .pacev.n{color:var(--faint);font-weight:400}
.pacesub{font:10.5px var(--mono);color:var(--faint)}

/* --- near me --- */
.mkr.me{width:16px;height:16px;background:#2f6fd0;border:2px solid #fff;
  box-shadow:0 0 0 7px rgba(47,111,208,.22);border-radius:50%}
.nearcity{display:flex;align-items:baseline;gap:8px;padding:9px 14px 5px;
  font:10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);background:var(--panel2);border-bottom:1px solid var(--line)}
.nearcity .km{margin-left:auto;color:var(--accent-ink)}
.neartabs{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);
  background:var(--panel)}
.neartabs .tgl{flex:1;justify-content:center}
.mapsearch .tgl.seg{margin-left:6px;border-radius:5px;padding:3px 9px;font-size:11px}
/* --- hero answer card --- */
.hero{border:1px solid var(--line);border-radius:14px;background:var(--panel);
  box-shadow:var(--sh);overflow:hidden;margin-bottom:var(--s3)}
.herotop{padding:var(--s3) var(--s3) var(--s2)}
.herotag{font:10px var(--mono);letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint)}
.hero h2{margin:9px 0 0;font-size:21px;line-height:1.38;font-weight:600;
  letter-spacing:-.01em;color:var(--ink);max-width:40ch}
.hero h2 b{color:var(--accent-ink);font-weight:650}
.herosub{margin:9px 0 0;font-size:13px;color:var(--dim);line-height:1.6;max-width:56ch}
.heroacts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border-top:1px solid var(--line)}
.heroact{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:13px 16px;
  background:var(--panel2);border:0;cursor:pointer;font:inherit}
.heroact:hover{background:var(--hover)}
.heroact .n{flex:none;width:19px;height:19px;border-radius:50%;background:var(--accent);
  color:#fff;font:10.5px/19px var(--mono);text-align:center;font-weight:600}
.heroact b{display:block;font-size:13px;font-weight:570;color:var(--ink);line-height:1.4}
.heroact em{display:block;margin-top:2px;font-style:normal;font-size:11.5px;
  color:var(--faint);line-height:1.5}
@media(max-width:820px){.heroacts{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);
  margin-bottom:var(--s3)}
.kpi{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;
  padding:14px 16px;border:1px solid var(--line);border-radius:11px;background:var(--panel);
  box-shadow:var(--sh);cursor:pointer;font:inherit}
.kpi:hover{border-color:var(--line2);background:var(--hover)}
.kpi.on{border-color:var(--accent);background:var(--accent-bg)}
.kpi .k{font:10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.kpi .v{font:25px/1.1 var(--mono);font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums}
.kpi.on .v{color:var(--accent-ink)}
.kpi .why{font-size:11px;color:var(--faint);line-height:1.45}
.filterline{display:flex;align-items:center;gap:9px;margin:-6px 0 16px;
  font-size:12.5px;color:var(--dim)}
@media(max-width:820px){
  .kpis{grid-template-columns:1fr}
  .wrap{padding:var(--s2) var(--s2) 72px}
  .two,.three{grid-template-columns:1fr}
  .maproot{grid-template-columns:1fr}
  .lens{flex-wrap:wrap}
  .composebox{max-width:calc(100vw - 24px)}
}
.stalerow .nm{color:var(--dim)}
.stalerow .logo{opacity:.55}
.decay{font:9.5px var(--mono);color:var(--amber);margin-left:4px}
.nowrap{white-space:nowrap;font:11.5px var(--mono);color:var(--dim)}
.ppsug{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.nearwhere{padding:9px 13px;font-size:11.5px;color:var(--dim);line-height:1.6;
  border-bottom:1px solid var(--line);background:var(--panel)}
.nearfix{display:block;margin-top:5px;color:var(--faint)}
.nearfix input{margin-left:6px;border:1px solid var(--line2);border-radius:6px;
  padding:3px 8px;font:11.5px var(--sans);width:120px}
.nearrow{cursor:pointer}
.nearrow:hover{background:var(--hover)}

/* --- outreach brief: the draft and its evidence in one drawer --- */
.btn.sm{padding:4px 10px;font-size:11.5px;border-radius:6px}
.tdact{text-align:right;white-space:nowrap}
.composebox.wide{max-width:680px}
.btrail{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bsent{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.bsent:last-child{border-bottom:0}
.bsent p{margin:0 0 7px;font-size:14px;line-height:1.6;color:var(--ink)}
.evrow{display:flex;gap:9px;align-items:baseline;font-size:11.5px;color:var(--dim);
  line-height:1.5;padding:3px 0}
.evk{font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent-ink);background:var(--accent-bg);border-radius:4px;
  padding:2px 6px;white-space:nowrap;flex:none}

/* --- round architect: lead + the funds that follow it --- */
.synlead{font-size:13px;color:var(--dim);line-height:1.6;margin:0 0 14px;max-width:62ch}
.syns{display:grid;gap:12px}
.syn{border:1px solid var(--line);border-radius:11px;background:var(--panel);
  box-shadow:var(--sh);overflow:hidden}
.synh{display:flex;align-items:center;gap:11px;padding:12px 14px;cursor:pointer;
  border-bottom:1px solid var(--line);background:var(--panel2)}
.synh:hover{background:var(--hover)}
.synt{flex:1;min-width:0}
.synt .nm{font-weight:620;font-size:14px}
.synt .sb{font:10.5px var(--mono);color:var(--faint);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.synms{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.synm{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--panel);min-width:0}
.synm>div{min-width:0}
.synm .nm{font-weight:550;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.synm .sb{font:10.5px var(--mono);color:var(--faint);margin-top:2px}
.synp{padding:11px 14px;font-size:12.5px;line-height:1.6;color:var(--ink);
  background:var(--blue-bg);border-top:1px solid var(--line)}
.synp b{color:var(--blue)}
.synp.cold{background:var(--panel2);color:var(--dim)}
@media(max-width:820px){.synms{grid-template-columns:1fr}}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line2);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;
  vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:900px){.app{grid-template-columns:1fr}.nav{display:none}
  .two,.three{grid-template-columns:1fr}.qsin{width:160px}}

/* ====================================================================
   Six features' styles landed here together after an audit found they
   had silently never been inserted: each edit anchored on a string an
   earlier edit had already rewritten, so the replace was a no-op and the
   markup rendered unstyled. Appended rather than threaded back in, so
   nothing below depends on text above it staying still.
   ==================================================================== */

/* progress: the work, shown while it runs */
.pgwrap{max-width:640px;margin:var(--s5) auto;padding:var(--s3);
  border:1px solid var(--line);border-radius:12px;background:var(--panel);
  box-shadow:var(--sh)}
.pghd{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--ink);
  margin-bottom:var(--s2)}
.pgsteps{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow-y:auto}
.pgstep{display:flex;align-items:baseline;gap:10px;padding:5px 0;font-size:12.5px;
  color:var(--dim);line-height:1.5}
.pgstep .tick{flex:none;width:14px;color:var(--green);font-size:11px}
.pgstep.now{color:var(--ink);font-weight:550}
.pgstep.now .tick::after{content:"\203A";color:var(--accent);font-weight:700}
.pgstep .tx{flex:1;min-width:0}
.pgstep .el{flex:none;font:10.5px var(--mono);color:var(--faint);
  font-variant-numeric:tabular-nums}

/* the plan */
.planwrap{border:1px solid var(--line);border-radius:11px;overflow:hidden;
  background:var(--panel);box-shadow:var(--sh)}
.planlist{display:flex;flex-direction:column}
.planrow{display:flex;align-items:center;gap:11px;padding:11px 14px;
  border-bottom:1px solid var(--line)}
.planrow:last-child{border-bottom:0}
.planrow .n{flex:none;width:20px;height:20px;border-radius:50%;
  background:var(--accent-bg);color:var(--accent-ink);
  font:10.5px/20px var(--mono);text-align:center;font-weight:600}
.planrow .nm{font-weight:560;font-size:13.5px}
.planrow .sb{font:10.5px var(--mono);color:var(--faint);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.planfoot{display:flex;align-items:center;gap:9px;padding:11px 14px;
  background:var(--panel2);border-top:1px solid var(--line);font-size:12px}

/* ask: which side of the graph, and what we are standing on */
.lens{display:flex;gap:6px;justify-content:center;margin:0 0 var(--s2)}
.lensbtn{padding:6px 13px;border:1px solid var(--line);border-radius:999px;
  background:var(--panel);color:var(--dim);font:12.5px var(--sans);cursor:pointer}
.lensbtn:hover{border-color:var(--line2);background:var(--hover)}
.lensbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.lenshint{font-size:11.5px;color:var(--faint);margin-right:auto;padding-left:4px}
.dm{font:10px var(--mono);letter-spacing:.04em;cursor:help}
.dm.cached{color:var(--blue)}
.dm.live{color:var(--green)}

/* honest absence */
.emptywhy{padding:var(--s2);border:1px dashed var(--line2);border-radius:10px;
  background:var(--panel2);font-size:13px;line-height:1.65;color:var(--dim);
  max-width:66ch}
.emptywhy b{color:var(--ink);display:block;margin-bottom:5px}
.emptywhy .sub{display:block;margin-top:8px;font-size:11.5px;color:var(--faint)}
.unchecked{color:var(--line2);font-weight:400;cursor:help}
.srcx{display:inline-block;font:10.5px var(--mono);color:var(--blue);
  text-decoration:none;margin-right:6px}
.srcx:hover{text-decoration:underline}
tbody tr.dim td{opacity:.5}
.reasons{margin:9px 0 0;padding-left:18px;font-size:12.5px;color:var(--dim);
  line-height:1.7}

/* the third reading */
.fswrap{max-width:860px;margin:0 auto}
.fshd h2{margin:0 0 6px;font-size:21px;font-weight:600;letter-spacing:-.012em}
.fshd p{margin:0 0 var(--s2);font-size:13.5px;line-height:1.7;color:var(--dim);
  max-width:62ch}
.fssearch input{width:100%;max-width:520px;padding:11px 14px;
  border:1px solid var(--line2);border-radius:10px;font:14px var(--sans);
  background:var(--panel)}
.fssearch input:focus{outline:0;border-color:var(--accent)}
.fschips{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s1)}
.chip.sm{padding:4px 11px;font-size:12px}
.fslist{display:flex;flex-direction:column;margin-top:var(--s2);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;
  background:var(--panel)}
.fsrow{display:flex;align-items:center;gap:12px;padding:11px 14px;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;
  font:inherit;width:100%}
.fsrow:last-child{border-bottom:0}
.fsrow:hover{background:var(--hover)}
.fsrow>div{flex:1;min-width:0}
.fsrow .nm{font-weight:560;font-size:13.5px}
.fsrow .d{font-size:11.5px;color:var(--faint);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsrow .go{font-size:11.5px;color:var(--accent-ink);white-space:nowrap}
.fsresult{margin-top:var(--s3)}

/* people a company names on its own page */
.teamwrap{margin-top:var(--s2);border:1px solid var(--line);border-radius:10px;
  background:var(--panel);overflow:hidden}
.teamhd{padding:10px 14px;background:var(--panel2);
  border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
.teamrow{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;
  border-bottom:1px solid var(--line)}
.teamrow:last-of-type{border-bottom:0}
.teamrow .av{flex:none;width:28px;height:28px;border-radius:8px;
  background:var(--panel2);border:1px solid var(--line);
  font:10.5px/26px var(--mono);text-align:center;color:var(--faint)}
.teamrow .nm{font-weight:560;font-size:13.5px}
.teamrow .q{font-size:11.5px;color:var(--faint);line-height:1.5;margin-top:3px;
  font-style:italic}
.teamfoot{padding:10px 14px;background:var(--panel2);
  border-top:1px solid var(--line);font-size:11px;color:var(--faint);
  line-height:1.6}

/* --- Ask Neo: a panel that knows what is on screen --- */
.neotab{position:fixed;right:18px;bottom:18px;display:flex;align-items:center;
  gap:9px;padding:9px 15px 9px 11px;border:1px solid var(--line2);
  border-radius:999px;background:var(--panel);color:var(--ink);
  font:13px var(--sans);font-weight:550;cursor:pointer;
  box-shadow:0 4px 16px rgba(28,26,23,.14);z-index:40}
.neotab:hover{background:var(--hover);box-shadow:0 6px 22px rgba(28,26,23,.18)}
.neotab .sq{width:22px;height:22px;border-radius:7px;background:var(--accent);
  color:#fff;font:700 11px/22px var(--sans);text-align:center}
body.neo-on .neotab{display:none}
/* The pick bar is sticky at the bottom of the ranking; the Neo pill lives in
   the same corner and was sitting on top of its primary button. */
body.has-picks .neotab{bottom:78px}

.neo{position:fixed;right:0;top:0;bottom:0;width:380px;max-width:92vw;
  display:none;flex-direction:column;background:var(--panel);
  border-left:1px solid var(--line);box-shadow:var(--sh2);z-index:45}
body.neo-on .neo{display:flex}
body.neo-on .main{padding-right:380px}
@media(max-width:1100px){body.neo-on .main{padding-right:0}}

.neohd{display:flex;align-items:center;gap:10px;padding:13px 14px;
  border-bottom:1px solid var(--line);background:var(--panel2)}
.neohd .sq{width:24px;height:24px;border-radius:7px;background:var(--accent);
  color:#fff;display:grid;place-items:center;font:700 12px var(--sans)}
.neohd b{display:block;font-size:13.5px}
.neohd .sub{display:block;font:10.5px var(--mono);color:var(--faint)}

.neobody{flex:1;overflow-y:auto;padding:16px 14px;display:flex;
  flex-direction:column;gap:16px}

.neointro{text-align:center;padding:28px 10px}
.neointro .sq{width:34px;height:34px;border-radius:10px;background:var(--accent);
  color:#fff;font:700 15px/34px var(--sans);margin:0 auto 14px}
.neointro p{margin:0 0 9px;font-size:13px;line-height:1.7;color:var(--dim)}
.neointro b{color:var(--ink)}
.neointro .sub{font-size:11.5px;color:var(--faint);line-height:1.6}

.neoq{align-self:flex-end;max-width:86%;padding:9px 13px;
  border-radius:13px 13px 3px 13px;background:var(--ink);color:#fff;
  font-size:13px;line-height:1.5}

.neoa{border:1px solid var(--line);border-radius:12px;background:var(--panel);
  padding:13px 14px;box-shadow:var(--sh)}
.neoa.thinking{display:flex;align-items:center;gap:9px;color:var(--faint);
  font-size:12.5px;border-style:dashed;box-shadow:none}
.neotop{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.neotop .tag{font:9.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;
  color:var(--accent-ink);background:var(--accent-bg);border-radius:5px;padding:2px 7px}
.neotop .src{margin-left:auto;font:9.5px var(--mono);color:var(--line2)}
.neoa .prose{margin:0 0 9px;color:var(--ink);font-size:13.5px;line-height:1.6}
.neoa .head{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink);font-weight:550}
.neoa ul{margin:10px 0 0;padding:0;list-style:none;display:flex;
  flex-direction:column;gap:7px}
.neoa li{position:relative;padding-left:14px;font-size:12.5px;line-height:1.6;
  color:var(--dim)}
.neoa li::before{content:"";position:absolute;left:2px;top:8px;width:4px;height:4px;
  border-radius:50%;background:var(--line2)}
.neoa .n{font:inherit;font-family:var(--mono);font-size:.94em;font-weight:600;
  color:var(--ink);font-variant-numeric:tabular-nums}
.neogo{display:inline-flex;align-items:center;gap:7px;margin-top:12px;
  padding:6px 12px;border:1px solid var(--line2);border-radius:8px;
  background:var(--panel2);color:var(--ink);font:12px var(--sans);
  font-weight:550;cursor:pointer}
.neogo:hover{background:var(--accent-bg);border-color:var(--accent);
  color:var(--accent-ink)}
.neogo span{color:var(--accent)}

.neochips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
.neochip{padding:6px 12px;border:1px solid var(--line);border-radius:999px;
  background:var(--panel);color:var(--dim);font:12px var(--sans);cursor:pointer;
  text-align:left}
.neochip:hover{border-color:var(--accent);color:var(--accent-ink);
  background:var(--accent-bg)}

.neoin{display:flex;gap:7px;padding:12px 14px;border-top:1px solid var(--line);
  background:var(--panel2)}
.neoin input{flex:1;min-width:0;padding:10px 13px;border:1px solid var(--line2);
  border-radius:10px;font:13px var(--sans);background:var(--panel)}
.neoin input:focus{outline:0;border-color:var(--accent)}alidated{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  padding:12px 15px;margin-bottom:var(--s2);border-radius:10px;
  background:var(--green-bg);border:1px solid var(--green-line);
  font-size:13px;line-height:1.6;color:#1f5e3a}
.validated b{color:#17452a}
.neotab .kbd{font:10px var(--mono);background:var(--panel2);border:1px solid var(--line);
  border-radius:4px;padding:1px 5px;color:var(--faint)}

.teampages{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.teampages .pg{font:10px var(--mono);color:var(--faint);background:var(--panel);
  border:1px solid var(--line);border-radius:5px;padding:2px 7px;cursor:help}
.teampages .pg.hit{color:var(--green);border-color:var(--green-line);
  background:var(--green-bg)}
.teampages .pg b{margin-left:5px;color:inherit}
.teamgrp{display:flex;align-items:center;gap:7px;padding:8px 14px 4px;
  font:9.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);background:var(--panel)}
.teamgrp span{color:var(--line2)}
.teamrow .via{font:9.5px var(--mono);color:var(--line2);margin-left:6px;
  text-transform:none;letter-spacing:0}
.teamrow .bio{display:inline-block;margin-top:3px;color:var(--blue);
  font-style:normal;text-decoration:none}
.teamrow .bio:hover{text-decoration:underline}

.evfoot{display:flex;flex-direction:column;gap:9px;margin-top:var(--s4);
  padding:var(--s2);border-top:1px solid var(--line);font-size:12.5px;
  color:var(--faint);line-height:1.6}
.evfoot b{color:var(--dim);font-weight:550}
.evfoot span{display:flex;flex-wrap:wrap;gap:16px}

/* The exclusion is the headline, so it carries the weight. */
.hero.warn{border-color:var(--red-line)}
.hero.warn .herotop{background:var(--red-bg)}
.hero.warn h2{color:#7d2619}
.hero.warn h2 b{color:#a3301f}
.hero.ok .herotop{background:var(--green-bg)}
.hero.ok h2,.hero.ok h2 b{color:#1f5e3a}
.hero .herosub{font-size:12.5px;color:var(--dim);line-height:1.75;max-width:none}
.hero.warn .herosub{color:#8c4436}
.herothen{margin:12px 0 0;padding-top:11px;border-top:1px solid rgba(0,0,0,.07);
  font-size:13px;color:var(--dim);line-height:1.6}
.herothen b{color:var(--ink)}
.quiet{padding:10px 14px;border-radius:9px;background:var(--panel2);
  border:1px solid var(--line);font-size:12.5px;color:var(--dim);
  line-height:1.6;cursor:help;margin-bottom:var(--s2)}
.quiet b{color:var(--ink)}
.synlead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}

/* --- fund profile: tabs, stats, portfolio --- */
.fhead{display:flex;align-items:flex-start;gap:var(--s2);padding:var(--s3) 0 var(--s2)}
.fhead h1{margin:0;font-size:24px;font-weight:620;letter-spacing:-.015em}
.fmeta{margin-top:5px;font-size:12.5px;color:var(--faint)}
.fmeta a{color:var(--blue);text-decoration:none}
.fmeta a:hover{text-decoration:underline}
.tab span{font:10px var(--mono);color:var(--faint);margin-left:3px}
.tab.thin{opacity:.5}
.fstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;margin:var(--s2) 0 var(--s3)}
.fstat{padding:14px 16px;border:1px solid var(--line);border-radius:11px;
  background:var(--panel);box-shadow:var(--sh)}
.fstat .k{font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint)}
.fstat .v{margin-top:6px;font:23px/1.1 var(--mono);font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums}
.fstat .s{margin-top:4px;font:10.5px var(--mono);color:var(--faint)}
.pcard{cursor:pointer;display:flex;flex-direction:column;gap:9px}
.pcard:hover{border-color:var(--line2);background:var(--hover)}
.pmeta{display:flex;align-items:baseline;gap:7px;font:11px var(--mono);
  color:var(--dim);padding-top:8px;border-top:1px solid var(--line)}
.pmeta span{color:var(--faint)}
.newslist{display:flex;flex-direction:column;gap:11px}
.newsitem{padding:13px 15px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);box-shadow:var(--sh)}
.newsitem p{margin:0;font-size:13.5px;line-height:1.65;color:var(--ink)}
.newsdocs{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.newsdocs a{font:10.5px var(--mono);color:var(--blue);text-decoration:none;
  background:var(--blue-bg);border-radius:5px;padding:3px 8px}
.newsdocs a:hover{text-decoration:underline}

/* --- alerts --- */
.alsteps{display:flex;gap:4px;padding:0 15px;border-bottom:1px solid var(--line)}
.alstep{padding:10px 14px;border:0;background:none;font:12.5px var(--sans);
  color:var(--faint);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.alstep.on{color:var(--accent-ink);border-bottom-color:var(--accent);font-weight:550}
.alrules{display:flex;flex-direction:column;gap:7px}
.alrule{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;
  border:1px solid var(--line);border-radius:10px;background:var(--panel);
  cursor:pointer;text-align:left;font:inherit;width:100%}
.alrule:hover{border-color:var(--line2);background:var(--hover)}
.alrule.on{border-color:var(--accent);background:var(--accent-bg)}
.alrule .sev{flex:none;width:7px;height:7px;border-radius:50%;margin-top:5px}
.alrule .sev.high{background:var(--red)}
.alrule .sev.medium{background:var(--amber)}
.alrule .sev.low{background:var(--line2)}
.alrule>span:nth-child(2){flex:1;min-width:0}
.alrule b{display:block;font-size:13px;font-weight:550;color:var(--ink)}
.alrule em{display:block;margin-top:2px;font-style:normal;font-size:11.5px;
  color:var(--faint);line-height:1.5}
.alrule .tick{color:var(--accent);font-weight:700}
.alhead{margin:4px 0 9px;font:10px var(--mono);letter-spacing:.07em;
  text-transform:uppercase;color:var(--faint)}
/* Stacked, not side by side: two flex siblings competing for one line made
   the title wrap a character at a time. */
.alrow{display:flex;flex-direction:column;gap:5px;padding:11px 13px;
  border:1px solid var(--line);border-radius:9px;margin-bottom:7px;
  background:var(--panel);font-size:13px;line-height:1.55}
.alrow .bdg{align-self:flex-start}
.alrow>div{min-width:0}
.alrow.high{border-color:var(--red-line);background:var(--red-bg)}
.alrow .sub{display:block;margin-top:2px;font-size:11.5px;color:var(--faint)}
.alexclude{margin:11px 0;padding:12px 14px;border-radius:10px;
  background:var(--ink);color:#fff;font-size:13px;line-height:1.6}
.alexclude .sub{display:block;margin-top:6px;font:11px var(--mono);
  color:rgba(255,255,255,.72);line-height:1.7}

.alrow .when{font:11px var(--mono);color:var(--faint)}
.alrow .sub{font-size:11.5px;color:var(--dim);line-height:1.6}

/* --- call list --- */
.calllist{display:flex;flex-direction:column;gap:8px}
.callrow{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;
  border:1px solid var(--line);border-radius:11px;background:var(--panel);
  box-shadow:var(--sh)}
.callrow.done{opacity:.5;background:var(--panel2)}
.callcheck{flex:none;width:22px;height:22px;margin-top:2px;border-radius:7px;
  border:1.5px solid var(--line2);background:var(--panel);cursor:pointer;
  color:var(--green);font:13px/18px var(--sans);font-weight:700;padding:0}
.callcheck:hover{border-color:var(--green)}
.callrow.done .callcheck{background:var(--green-bg);border-color:var(--green-line)}
.callrow .av{flex:none;width:34px;height:34px;border-radius:10px;
  background:var(--panel2);border:1px solid var(--line);text-align:center;
  font:11px/32px var(--mono);color:var(--faint)}
.callrow .who{flex:1;min-width:0}
.callrow .nm{font-size:14px;font-weight:570;color:var(--ink)}
.callrow .role{margin-left:7px;font:11px var(--mono);color:var(--accent-ink);
  background:var(--accent-bg);border-radius:5px;padding:2px 7px}
.callrow .at{display:flex;align-items:center;gap:6px;margin-top:5px;
  font-size:12.5px;color:var(--dim)}
.callrow .at .logo{width:16px;height:16px;border-radius:4px;padding:1px}
.callrow .at .sc{font:10.5px var(--mono);color:var(--faint)}
.callrow .src{font:9.5px var(--mono);letter-spacing:.05em;border-radius:4px;
  padding:2px 6px;text-transform:uppercase}
.callrow .src.cala{background:var(--green-bg);color:var(--green)}
.callrow .src.site{background:var(--panel2);color:var(--faint)}
.callrow .why{margin-top:5px;font:11px var(--mono);color:var(--faint);
  line-height:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.callrow .warm{margin-top:4px;font-size:11.5px;color:var(--blue)}
.callrow .acts{display:flex;gap:6px;align-items:center;flex:none}

/* --- person card --- */
.pcstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.pcstat{display:flex;flex-direction:column;gap:3px;padding:11px 13px;
  border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.pcstat .k{font:9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint)}
.pcstat .v{font:19px/1.1 var(--mono);font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums}
.pcstat .v.hit{color:var(--green)}
.pcstat .s{font:10px var(--mono);color:var(--faint);line-height:1.4}
.pcblock{margin-top:var(--s2)}
.pch{display:flex;align-items:baseline;gap:8px;font:10px var(--mono);
  letter-spacing:.07em;text-transform:uppercase;color:var(--faint);
  margin-bottom:7px}
.pch span{color:var(--line2)}
.pclist{display:flex;flex-direction:column;gap:6px}
.pcrow{padding:9px 12px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel);font-size:13px;line-height:1.5}
.pcrow b{font-weight:560;color:var(--ink)}
.pcrow .tag{margin-left:7px;font:9.5px var(--mono);color:var(--faint);
  background:var(--panel2);border-radius:4px;padding:2px 6px;text-transform:uppercase}
.pcrow .mk{margin-left:6px;font:9.5px var(--mono);color:var(--green);
  background:var(--green-bg);border-radius:4px;padding:2px 6px}
.pcrow .yr{margin-left:6px;font:10.5px var(--mono);color:var(--faint)}
.pcrow .what{margin-top:4px;font-size:11.5px;color:var(--faint);line-height:1.55}
/* the reasons a person moved up the call list */
.callrow .pwhy{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.callrow .pwhy span{font:10.5px var(--mono);color:var(--green);
  background:var(--green-bg);border-radius:5px;padding:2px 7px}
.callrow .pwhy .via{color:var(--faint);background:var(--panel2)}
.callrow .cscore{font:12px var(--mono);font-weight:600;color:var(--dim);
  font-variant-numeric:tabular-nums;cursor:help;margin-right:2px}

/* Record tab: the coverage bars that say what we actually hold on an entity. */
.dcov{display:grid;grid-template-columns:minmax(0,15rem) 1fr 3.5rem;gap:var(--s2);
  align-items:center;padding:4px 0}
.dcovk{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcovk .sub{font-size:.78em;margin-left:.5ch}
.dcovb{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.dcovb i{display:block;height:100%;background:var(--accent);border-radius:3px}
.dcovn{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
@media (max-width:640px){.dcov{grid-template-columns:1fr 2.5rem}.dcovb{display:none}}

/* ---------------------------------------------------------------- intake */
.ask textarea{min-height:92px}
.attach{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;
  color:var(--dim);cursor:pointer;padding:5px 10px;border-radius:8px;
  border:1px dashed var(--line2)}
.attach:hover{color:var(--ink);border-color:var(--accent);background:var(--accent-bg)}
.attach .clip{font-size:15px;line-height:1}
.bfiles{display:flex;flex-wrap:wrap;gap:7px;padding:0 16px 8px}
.bfile{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;
  background:var(--hover);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.bfi{font:600 9.5px/1 var(--mono,var(--sans));letter-spacing:.06em;color:var(--accent-ink);
  background:var(--accent-bg);border-radius:4px;padding:3px 5px}
.bfn{max-width:20ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bfx{border:0;background:none;color:var(--faint);font-size:15px;line-height:1;padding:0 2px}
.bfx:hover{color:var(--ink)}
.askalt{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  align-items:center;margin-top:22px}

.intakewrap{max-width:860px;margin:0 auto;padding:40px 20px 60px}
.pfcard{padding:0;overflow:hidden;margin:18px 0 22px}
.pfhd{padding:13px 18px;border-bottom:1px solid var(--line);font-weight:600;
  font-size:13px;letter-spacing:.01em}
.pfrow{display:grid;grid-template-columns:minmax(0,9rem) 1fr minmax(0,13rem);
  gap:var(--s2);padding:10px 18px;border-bottom:1px solid var(--line);align-items:baseline}
.pfrow:last-child{border-bottom:0}
.pfrow.thin{opacity:.6}
.pfk{color:var(--dim);font-size:12.5px}
.pfv{min-width:0;line-height:1.55}
.pfs{font-size:11.5px;color:var(--faint);text-align:right;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.pfbad{padding:12px 18px;background:var(--accent-bg);color:var(--accent-ink);
  font-size:12.5px;line-height:1.6}
.chip.sm{padding:3px 9px;font-size:11.5px;box-shadow:none}
.pctitles{margin:var(--s2) 0}

.rsn{max-height:48vh;overflow:auto;border:1px solid var(--line);border-radius:12px;
  background:var(--panel);padding:6px 0}
.rstep{display:grid;grid-template-columns:18px 4.6rem 1fr auto;gap:10px;
  align-items:baseline;padding:7px 16px;font-size:13px}
.rstep.done{color:var(--dim)}
.rstep.now{color:var(--ink)}
.rtick{color:var(--accent);font-size:11px}
.rstep.now .rtick::before{content:"";display:inline-block;width:7px;height:7px;
  border-radius:50%;background:var(--accent);animation:rpulse 1s infinite}
@keyframes rpulse{0%,100%{opacity:1}50%{opacity:.25}}
.rlay{font:600 9.5px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;
  border-radius:4px;padding:4px 6px;text-align:center;white-space:nowrap}
.l-you{background:#efe9df;color:#6b5b43}
.l-cala{background:var(--accent-bg);color:var(--accent-ink)}
.l-web{background:#e6eef0;color:#38606b}
.l-derived{background:#eceaf2;color:#55507a}
.rtx{min-width:0;line-height:1.5}
.rwhy{display:block;color:var(--faint);font-size:12px;line-height:1.55;margin-top:2px;
  max-width:70ch}
.rel{color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
@media (max-width:640px){.rstep{grid-template-columns:16px 1fr auto}.rlay{display:none}
  .pfrow{grid-template-columns:1fr}.pfs{text-align:left}}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
  background:var(--ink);color:var(--bg,#fff);padding:11px 16px;border-radius:10px;
  font-size:13px;box-shadow:var(--sh2);z-index:90;transition:opacity .4s}
.toast.go{opacity:0}

/* ------------------------------------------------- pick, and the reach view */
.w-pick{width:34px}
.pick{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line2);
  background:var(--panel);display:grid;place-items:center;font-size:10px;
  color:#fff;line-height:1}
.pick:hover{border-color:var(--accent)}
.pick.on{background:var(--accent);border-color:var(--accent)}
.nopick{color:var(--faint)}
tr.picked{background:var(--accent-bg)}

.pickbar{position:sticky;bottom:14px;z-index:41;display:flex;align-items:center;
  gap:var(--s2);margin:var(--s3) 0;padding:11px 14px;border-radius:12px;
  background:var(--ink);color:#fff;box-shadow:var(--sh2)}
.pickbar .pkn{font-weight:620;white-space:nowrap}
.pickbar .pknames{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;opacity:.72;font-size:12.5px}
.pickbar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.pickbar .btn:hover{background:rgba(255,255,255,.12)}
.pickbar .btn.primary{background:var(--accent);border-color:var(--accent)}
.pickbar .btn.primary:hover{background:var(--accent-ink)}

.reachhd{display:flex;align-items:flex-start;gap:var(--s3);margin-bottom:var(--s3)}
.reachhd h2{margin:0 0 6px;font-size:19px;letter-spacing:-.02em}
.reachhd p{margin:0;max-width:62ch;line-height:1.65}
.reachhd .btn{margin-left:auto;white-space:nowrap}
.reachgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,25rem);
  gap:var(--s3);align-items:start}
.reachlist{min-width:0}
.reachmap{position:sticky;top:var(--s3)}
.rmap{height:60vh;min-height:360px;border-radius:12px;overflow:hidden;
  border:1px solid var(--line);background:var(--panel)}
.rmapfoot{margin-top:9px;font-size:12px;color:var(--dim);line-height:1.6}
.rpin{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;font:600 9.5px/1 var(--sans);
  border:2px solid #fff;box-shadow:var(--sh);cursor:pointer}
.rpin.near{background:var(--panel);color:var(--dim);border-color:var(--line2)}
/* Country-only: we know the country and not the street, and a solid pin on
   the capital claims a precision we do not have. */
.rpin.loose{background:var(--accent-bg);color:var(--accent-ink);
  border-style:dashed;border-color:var(--accent)}
@media (max-width:980px){.reachgrid{grid-template-columns:1fr}
  .reachmap{position:static}.rmap{height:40vh}}

/* The line that replaced the re-run form above the ranking. */
.runline{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;
  padding:0 0 var(--s3);border-bottom:1px solid var(--line);margin-bottom:var(--s3)}
.rl1{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;font-size:16px}
.rl1 b{letter-spacing:-.015em}
.rl2{margin-left:auto;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}

/* The two sides of the same graph. A founder reads it for who can lead their
   round; an investor reads it for who is being backed again by the people who
   already know them. Same engine, opposite question - which is the name. */
.roleswitch{display:flex;gap:2px;margin:10px 10px 4px;padding:2px;
  background:var(--hover);border-radius:9px}
.rolebtn{flex:1;border:0;background:none;border-radius:7px;padding:6px 8px;
  font:12.5px var(--sans);font-weight:550;color:var(--dim);white-space:nowrap}
.rolebtn:hover{color:var(--ink)}
.rolebtn.on{background:var(--panel);color:var(--ink);box-shadow:var(--sh)}
.convlist{border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:var(--panel)}
.convlist .convrow:last-child{border-bottom:0}
.convrow{display:grid;grid-template-columns:2.2rem 1fr 5.5rem 7rem;gap:var(--s2);
  align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);
  cursor:pointer;text-align:left;width:100%;background:none;border-left:0;
  border-right:0;border-top:0}
.convrow:hover{background:var(--hover)}
.convrow .rk{color:var(--faint);font-variant-numeric:tabular-nums;font-size:12.5px}
.convrow .nm{font-weight:560}
.convrow .wh{color:var(--dim);font-size:12.5px;line-height:1.5;margin-top:2px}
.convrow .sc{text-align:right;font-variant-numeric:tabular-nums;font-weight:620}
@media (max-width:720px){.convrow{grid-template-columns:2rem 1fr 4rem}
  .convrow .st{display:none}}

/* The pipeline: five columns because a raise has five states. */
.deals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s2);
  align-items:start}
.dcol{min-width:0;background:var(--hover);border-radius:12px;padding:8px}
.dcolh{padding:4px 6px 9px}
.dcolh b{font-size:12.5px}
.dcolh .n{float:right;color:var(--faint);font-variant-numeric:tabular-nums;
  font-size:12px}
.dcolh .sub{font-size:11px;line-height:1.45;margin-top:3px}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:9px;margin-bottom:7px;box-shadow:var(--sh)}
.dcard.bad{border-color:var(--accent);background:var(--accent-bg)}
.dch{display:flex;align-items:center;gap:6px;min-width:0}
.dch b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:12.5px}
.dch .sc{color:var(--dim);font-variant-numeric:tabular-nums;font-size:11.5px}
.dch img,.dch .mono{width:16px;height:16px;flex:0 0 16px}
.dwarn{margin-top:6px;font-size:11px;line-height:1.45;color:var(--accent-ink)}
.dcc{margin-top:6px;font-size:11.5px;line-height:1.4}
.dcc .sub{display:block;font-size:10.5px}
.dcw{margin-top:5px;font-size:11px;color:var(--dim);line-height:1.4}
.dcacts{display:flex;gap:4px;margin-top:8px}
.dcacts .btn{padding:2px 7px;font-size:11px;line-height:1.5}
.dcacts .btn[disabled]{opacity:.35}
.dempty{padding:10px 6px;font-size:11.5px}
@media (max-width:1100px){.deals{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.deals{grid-template-columns:1fr}}

.alrules{margin-top:var(--s3);border-top:1px solid var(--line);padding-top:var(--s2)}
.alrules summary{cursor:pointer;color:var(--dim);font-size:12.5px;list-style:none}
.alrules summary::-webkit-details-marker{display:none}
.alrules summary::before{content:"\25B8 ";color:var(--faint)}
.alrules[open] summary::before{content:"\25BE "}

.maplegend{display:flex;flex-wrap:wrap;gap:var(--s3);margin:-6px 0 var(--s3);
  font-size:12px;color:var(--dim)}
.maplegend span{display:inline-flex;align-items:center;gap:6px}
.maplegend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.maplegend i.dash{background:transparent;border:2px dashed var(--line2)}
</style>
</head>
<body>
<div class="app">
  <aside class="nav">
    <div class="brand"><span class="sq">F</span><b>Flipside</b></div>
    <div class="navsearch">
      <div class="qsin"><span class="mag">⌕</span>
        <input id="qsq" placeholder="Search funds and people" autocomplete="off">
        <kbd>/</kbd></div>
      <div class="qspop" id="qspop">
        <div class="qstabs">
          <button class="qstab on" data-k="fund">Funds</button>
          <button class="qstab" data-k="people">People</button>
        </div>
        <div class="qsres" id="qsres"></div>
      </div>
    </div>
    <button class="navitem on" data-mode="home"><span class="ic"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 7l6-4.5L14 7v6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/></svg></span>Ask</button>
    <div class="roleswitch" id="roleswitch">
      <button class="rolebtn on" data-role="founder">I'm raising</button>
      <button class="rolebtn" data-role="investor">I'm investing</button>
    </div>
    <div class="navrole" id="navfounder">
      <div class="navsec">Your raise</div>
      <button class="navitem" data-mode="founder"><span class="ic"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 9.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M2.5 14a5.5 5.5 0 0 1 11 0"/></svg></span>Your round<span class="ct" id="ct-f"></span></button>
      <button class="navitem" data-mode="calls"><span class="ic"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3.5h3l1.2 3-1.6 1.2a8 8 0 0 0 3.7 3.7L10.5 10l3 1.2v3a1 1 0 0 1-1.1 1A11.5 11.5 0 0 1 2 4.6 1 1 0 0 1 3 3.5z"/></svg></span>Call list</button>
      <button class="navitem" data-mode="map"><span class="ic"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4.5 6 3l4 1.5L14 3v8.5L10 13 6 11.5 2 13z"/><path d="M6 3v8.5M10 4.5V13"/></svg></span>Where they are</button>
      <button class="navitem" data-mode="deals"><span class="ic"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="3.5" height="10" rx="1"/><rect x="6.5" y="3" width="3.5" height="7" rx="1"/><rect x="11" y="3" width="3" height="4.5" rx="1"/></svg></span>Pipeline<span class="ct" id="ct-d"></span></button>
    </div>
    <div class="navrole" id="navinvestor" hidden>
      <div class="navsec">Your pipeline</div>
      <button class="navitem" data-mode="investor"><span class="ic"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12.5 6 7l3 3 5-6.5"/><path d="M10.5 3.5H14v3.5"/></svg></span>Insider conviction<span class="ct" id="ct-i"></span></button>
      <button class="navitem" data-mode="map"><span class="ic"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4.5 6 3l4 1.5L14 3v8.5L10 13 6 11.5 2 13z"/><path d="M6 3v8.5M10 4.5V13"/></svg></span>Where they are</button>
    </div>
    <div class="navsec">Context</div>
    <div class="navitem" style="cursor:default" id="datamode"></div>
    <div class="navitem" style="cursor:default"><span class="ic"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="3.5" width="11" height="10" rx="1.5"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3"/></svg></span>Slush 2026<span class="ct">18 Nov</span></div>
  </aside>
  <main class="main">
    <div class="bar">
      <span class="crumb" id="crumb"></span>
      <span class="grow"></span>
      <span id="baracts"></span>
      </div>
    <div class="wrap" id="view"></div>
  </main>
</div>
